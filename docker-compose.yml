version: "3.8"
services:
  db:
    image: postgres:15
    container_name: evasao_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: consulta
      POSTGRES_PASSWORD: teste123
      POSTGRES_DB: evasao
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"

volumes:
  pgdata:
